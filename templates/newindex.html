<script>
  const panel = document.getElementById('retractable');
  const toggleBtn = document.getElementById('toggleBtn');
  const content = panel.querySelector('.panel-content');
  let collapsed = false;

  
  toggleBtn.addEventListener('click', () => {
    collapsed = !collapsed;
    if (collapsed) {
      content.style.display = 'none';
      toggleBtn.textContent = '▲';
    } else {
      content.style.display = 'block';
      toggleBtn.textContent = '▼';
    }
  });

  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.tab-panel');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    });
  });



// Retry images that fail to load (transient upstream/proxy errors). A saved list
// whose proxy domain is unreachable falls back to this server's proxy.
function attachImageRetry(img, maxRetries = 3) {
  let attempt = 0;
  img.addEventListener('load', () => img.classList.remove('img-failed'));
  img.addEventListener('error', () => {
    const src = img.getAttribute('src');
    if (!src) return;

    try {
      const u = new URL(src, location.href);
      if (u.pathname === '/proxy' && u.origin !== location.origin &&
          u.searchParams.has('url') && !img.dataset.originFallback) {
        img.dataset.originFallback = '1';
        img.src = `${location.origin}/proxy?url=${encodeURIComponent(u.searchParams.get('url'))}`;
        return;
      }
    } catch { /* not a parseable URL; plain retry below */ }

    if (attempt >= maxRetries) {
      img.classList.add('img-failed');
      img.title = `Failed to load: ${img.alt}`;
      return;
    }
    attempt++;
    setTimeout(() => {
      img.removeAttribute('src');  // re-setting the same src forces a new request
      img.src = src;
    }, 600 * 2 ** (attempt - 1));
  });
}
window.attachImageRetry = attachImageRetry;

let searchController = null;

document.getElementById('inputForm').addEventListener('submit', async function(event) {
    event.preventDefault();

    const status = document.getElementById('response');
    const query = document.getElementById('searchbar').value.trim();
    if (!query) return;

    // Cancel a search still in flight so stale results can't overwrite new ones
    searchController?.abort();
    searchController = new AbortController();
    const { signal } = searchController;

    status.innerText = 'Searching...';
    try {
        const response = await fetch('/submit', { method: 'POST', body: new FormData(this), signal });
        if (!response.ok) throw new Error(`Server returned ${response.status}`);
        const data = await response.json();

        status.innerText = data.response;
        const imageContainer = document.querySelector('.scroll-container');
        const fragment = document.createDocumentFragment();

        (data.boxarts || []).forEach(([url, title]) => {
            const imgElement = document.createElement('img');
            imgElement.loading = 'lazy';      // only fetch what's scrolled into view
            imgElement.decoding = 'async';
            imgElement.alt = title;
            imgElement.title = title;
            imgElement.draggable = true;
            imgElement.style.margin = '5px';
            imgElement.addEventListener('dragstart', handleDragStart);
            imgElement.addEventListener('dragend', handleDragEnd);
            imgElement.addEventListener('dblclick', handleImageRemove);
            attachImageRetry(imgElement);
            imgElement.src = `/proxy?url=${encodeURIComponent(url)}`;
            fragment.appendChild(imgElement);
        });

        imageContainer.replaceChildren(fragment);
        imageContainer.scrollTop = 0;
    } catch (error) {
        if (error.name === 'AbortError') return;
        status.innerText = 'Search failed — try again.';
        console.error('Search error:', error);
    }
});

document.getElementById('searchbar').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault(); // Prevent the default behavior
        document.getElementById('inputForm').dispatchEvent(new Event('submit')); // Trigger the submit event
    }
});

function handleDragStart(event) {
    event.dataTransfer.setData('text/plain', event.target.src);
    event.target.classList.add('dragging');
}

function handleDragEnd(event) {
    event.target.classList.remove('dragging');
}

function handleDragover(event) {
    event.preventDefault(); // Allow drop
}

function handleDrop(event) {
    event.preventDefault(); // Prevent default browser handling

    const draggedImage = document.querySelector('.dragging');
    if (!draggedImage) {
        console.error('No image is being dragged.');
        return;
    }

    const target = event.target;
    if (target.classList.contains("items")) {
        target.appendChild(draggedImage);
        updateAltTextColorAndOrder();
    } else if (target.tagName === "IMG" && target !== draggedImage) {
        const { left, width } = target.getBoundingClientRect();
        const midPoint = left + width / 2;

        if (event.clientX < midPoint) {
            target.before(draggedImage);
        } else {
            target.after(draggedImage);
        }
        updateAltTextColorAndOrder();
    }
}

function handleImageRemove(event) {
    // Remove the image from the tier
    const image = event.target;
    image.remove();

    // Update the alt text in the game-title-container
    updateAltTextColorAndOrder();
}

// Tier sections the user collapsed in the sidebar (kept across rebuilds)
const collapsedTitleTiers = new WeakSet();

function updateAltTextColorAndOrder() {
  const body = document.getElementById('titleSidebarBody');
  if (!body) return;
  const scrollTop = body.scrollTop;
  body.innerHTML = '';

  let totalSeconds = 0;

  document.querySelectorAll('.tier').forEach(tier => {
    const labelEl = tier.querySelector('.label');
    const tierColor = getComputedStyle(labelEl).getPropertyValue('--color').trim() || '#ccc';
    const tierName = (tier.querySelector('.label span')?.textContent || '').trim() || '(unnamed)';
    const images = tier.querySelectorAll('.items img');

    const section = document.createElement('details');
    section.className = 'title-tier';
    section.style.setProperty('--tier-color', tierColor);
    section.open = !collapsedTitleTiers.has(tier);
    section.addEventListener('toggle', () => {
      if (section.open) collapsedTitleTiers.delete(tier);
      else collapsedTitleTiers.add(tier);
    });

    const summary = document.createElement('summary');
    const nameEl = document.createElement('span');
    nameEl.className = 'title-tier-name';
    nameEl.textContent = tierName;
    const metaEl = document.createElement('span');
    metaEl.className = 'title-tier-meta';
    summary.append(nameEl, metaEl);
    section.appendChild(summary);

    let tierSeconds = 0;
    images.forEach(image => {
      if (!image.dataset.hours) image.dataset.hours = "0";
      if (!image.dataset.minutes) image.dataset.minutes = "0";
      if (!image.dataset.seconds) image.dataset.seconds = "0";
      const secs = parseTimeToSeconds(image.dataset.hours, image.dataset.minutes, image.dataset.seconds);
      tierSeconds += secs;

      const row = document.createElement('div');
      row.className = 'title-row';

      const titleElement = document.createElement('span');
      titleElement.className = 'title-row-name';
      titleElement.textContent = image.alt || '';
      titleElement.title = image.alt || '';
      titleElement.contentEditable = 'plaintext-only';
      bindAltTextSync(titleElement, image);

      const timeDisplay = document.createElement('span');
      timeDisplay.className = 'title-row-time';
      timeDisplay.textContent = formatSeconds(secs);

      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'title-row-edit';
      editBtn.textContent = '⏱️';
      editBtn.title = 'Edit playtime';
      editBtn.addEventListener('click', () => openPlaytimeEditor(image));

      row.append(titleElement, timeDisplay, editBtn);
      section.appendChild(row);
    });

    if (images.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'title-tier-empty';
      empty.textContent = 'No games';
      section.appendChild(empty);
    }

    metaEl.textContent = `${images.length} · ${formatSeconds(tierSeconds)}`;
    totalSeconds += tierSeconds;
    body.appendChild(section);
  });

  document.getElementById('totalPlaytime').textContent = `Time Wasted: ${formatSeconds(totalSeconds)}`;
  body.scrollTop = scrollTop;
  window.scheduleRenderEstimate?.();
}

function openPlaytimeEditor(image) {
  const modal = document.querySelector('.playtime-modal');
  const hoursField = document.getElementById('playtimeHours');
  const minutesField = document.getElementById('playtimeMinutes');
  const secondsField = document.getElementById('playtimeSeconds');
  const saveBtn = document.getElementById('savePlaytime');
  const cancelBtn = document.getElementById('cancelPlaytime');

  hoursField.value = image.dataset.hours || "0";
  minutesField.value = image.dataset.minutes || "0";
  secondsField.value = image.dataset.seconds || "0";
  modal.showModal();

  const cleanup = () => {
    modal.close();
    saveBtn.removeEventListener('click', handleSave);
    cancelBtn.removeEventListener('click', cleanup);
  };
  const handleSave = () => {
    image.dataset.hours = hoursField.value || "0";
    image.dataset.minutes = minutesField.value || "0";
    image.dataset.seconds = secondsField.value || "0";
    cleanup();
    updateAltTextColorAndOrder();  // refreshes row, tier subtotal and total
  };
  saveBtn.addEventListener('click', handleSave);
  cancelBtn.addEventListener('click', cleanup);
}

// Sidebar show/hide, remembered between visits
(() => {
  const sidebar = document.getElementById('titleSidebar');
  const toggle = document.getElementById('titleSidebarToggle');
  const apply = (collapsed) => {
    sidebar.classList.toggle('collapsed', collapsed);
    toggle.title = collapsed ? 'Show game titles' : 'Hide game titles';
  };
  apply(localStorage.getItem('titleSidebarCollapsed') === '1');
  toggle.addEventListener('click', () => {
    const collapsed = !sidebar.classList.contains('collapsed');
    localStorage.setItem('titleSidebarCollapsed', collapsed ? '1' : '0');
    apply(collapsed);
  });
})();

// Keep tier headers in sync when tiers are renamed, recolored, added, moved or deleted
(() => {
  const tiersEl = document.querySelector('.tiers');
  let pending = false;
  new MutationObserver((mutations) => {
    // ignore changes that only touch images (dragging, alt edits)
    const relevant = mutations.some(m =>
      m.type === 'characterData' ||
      (m.type === 'attributes' && m.target.classList?.contains('label')) ||
      (m.type === 'childList' && (m.target === tiersEl || m.target.classList?.contains('items')))
    );
    if (!relevant || pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; updateAltTextColorAndOrder(); });
  }).observe(tiersEl, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['style'] });
})();

// Helper: convert runtime → seconds
function parseTimeToSeconds(h, m, s) {
  const hh = parseInt(h) || 0;
  const mm = parseInt(m) || 0;
  const ss = parseInt(s) || 0;
  return hh * 3600 + mm * 60 + ss;
}

function formatSeconds(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
}

function calculateTotalPlaytime() {
  updateAltTextColorAndOrder();
}

function bindAltTextSync(titleElement, image) {
  // Ensure initial sync
  image.alt = titleElement.textContent.trim();

  // Live update while typing
  titleElement.addEventListener('input', () => {
    image.alt = titleElement.textContent.trim();
  });

  // Cleanup pasted HTML / newlines
  titleElement.addEventListener('blur', () => {
    titleElement.textContent = titleElement.textContent.replace(/\s+/g, ' ').trim();
    image.alt = titleElement.textContent;
    window.scheduleRenderEstimate?.();  // title widths affect layout
  });
}


function makeImagesDraggable() {
    const images = document.querySelectorAll('.scroll-container img');
    images.forEach((img) => {
        img.draggable = true;
        img.addEventListener('dragstart', handleDragStart);
        img.addEventListener('dragend', handleDragEnd);
        img.addEventListener('dblclick', handleImageRemove); // Add double-click event for removal
    });
}
